# 2026-08-26 — owner decision (Rohit, explicit "yes"): maez-web must be
# able to SEE the ledger activation flag. Verified 2026-08-24: the unit
# loaded NO EnvironmentFile while the birth checklist lands
# MAEZ_LEDGER_WRITES=1 in model.env, which only maez.service read — so
# every post-birth web turn would have been silently omitted from
# admission (the exact Theme-2 failure class).
#
# model.env stays the single source of truth (the s7-proxy drop-in
# already names it as such; the ceremony's _activation_flag_landed()
# scans it). "-" prefix: a missing file must not fail unit start.
# Tradeoff, stated: this exposes model.env's other entries to the web
# process's exec environment. In practice web already converges on the
# same secrets via load_secrets_for_process() at import (verified
# 2026-08-24), so the delta is exec-time visibility, not new access.
#
# Install: cp to ~/.config/systemd/user/maez-web.service.d/ then
# systemctl --user daemon-reload. Takes effect at the unit's next
# natural restart — do NOT restart it for this.
[Service]
EnvironmentFile=-%h/.config/maez/model.env
