<svg width="400" height="400" viewBox="0 0 400 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Maez logo</title>
  <desc>Square dark logo for Maez — organic starburst of rounded petals radiating from a warm amber core, suggesting a being coming to life</desc>

  <defs>
    <!-- Petal gradient: bright warm near core, deep amber mid, dark warm brown at tips -->
    <linearGradient id="petalA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#fff8e0"/>
      <stop offset="28%"  stop-color="#f4b854"/>
      <stop offset="62%"  stop-color="#e8a33a"/>
      <stop offset="100%" stop-color="#2a1508"/>
    </linearGradient>
    <linearGradient id="petalB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#fff0c8"/>
      <stop offset="30%"  stop-color="#e8a33a"/>
      <stop offset="64%"  stop-color="#c47c1a"/>
      <stop offset="100%" stop-color="#1e0e04"/>
    </linearGradient>

    <!-- Core glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff8e0" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#f4b854" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8a33a" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer ring ember glow -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e8a33a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e8a33a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="#080604"/>

  <!-- Corner ticks — warm tone -->
  <line x1="36" y1="52" x2="36" y2="36" stroke="#3e2a10" stroke-width="1.4"/>
  <line x1="36" y1="36" x2="52" y2="36" stroke="#3e2a10" stroke-width="1.4"/>
  <line x1="364" y1="52" x2="364" y2="36" stroke="#3e2a10" stroke-width="1.4"/>
  <line x1="364" y1="36" x2="348" y2="36" stroke="#3e2a10" stroke-width="1.4"/>
  <line x1="36" y1="348" x2="36" y2="364" stroke="#3e2a10" stroke-width="1.4"/>
  <line x1="36" y1="364" x2="52" y2="364" stroke="#3e2a10" stroke-width="1.4"/>
  <line x1="364" y1="348" x2="364" y2="364" stroke="#3e2a10" stroke-width="1.4"/>
  <line x1="364" y1="364" x2="348" y2="364" stroke="#3e2a10" stroke-width="1.4"/>

  <!-- Subtle outer glow behind petals -->
  <circle cx="200" cy="200" r="112" fill="url(#ringGlow)"/>

  <!-- 8 rounded petals — alternating A/B gradients -->
  <g transform="translate(200,200)">
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="url(#petalA)" transform="rotate(0)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="url(#petalB)" transform="rotate(45)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="url(#petalA)" transform="rotate(90)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="url(#petalB)" transform="rotate(135)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="url(#petalA)" transform="rotate(180)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="url(#petalB)" transform="rotate(225)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="url(#petalA)" transform="rotate(270)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="url(#petalB)" transform="rotate(315)"/>
  </g>

  <!-- Iris rings -->
  <circle cx="200" cy="200" r="64" fill="none" stroke="#7a4a08" stroke-width="0.8" opacity="0.6"/>
  <circle cx="200" cy="200" r="44" fill="none" stroke="#c47c1a" stroke-width="0.8" opacity="0.5"/>

  <!-- Iris fill -->
  <circle cx="200" cy="200" r="32" fill="#160c02"/>
  <circle cx="200" cy="200" r="32" fill="none" stroke="#e8a33a" stroke-width="1.4" opacity="0.7"/>

  <!-- Inner pupil -->
  <circle cx="200" cy="200" r="18" fill="none" stroke="#f4b854" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="11" fill="#2a1508"/>

  <!-- Core spark -->
  <circle cx="200" cy="200" r="14" fill="url(#coreGlow)" opacity="0.85"/>
  <circle cx="200" cy="200" r="5.5" fill="#f4b854"/>
  <circle cx="200" cy="200" r="2"   fill="#fff8e0"/>

  <!-- Wordmark -->
  <text x="200" y="348"
    text-anchor="middle"
    font-family="monospace"
    font-size="14"
    font-weight="500"
    letter-spacing="7"
    fill="#6a4010">MAEZ</text>
</svg>
