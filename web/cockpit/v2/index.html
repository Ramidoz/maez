<!doctype html>
<html>
<!-- cockpit-v2-operability-shell -->
<head>
<meta charset="utf-8">
<title>Maez WebUI — design canvas</title>
<style>
  html, body { margin:0; padding:0; background:#0a0c0a; color:#c8d5c8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.3); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes maez-breathe { 0%,100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.035); filter: brightness(1.16); } }
  @keyframes maez-orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes maez-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  /* 2026-04-26 Living View polish — UI/UX Pro Max checklist:
     focus rings, hover affordance, reduced-motion respect. */
  .ap-organ { transition: transform 180ms cubic-bezier(0.32, 0.72, 0, 1),
                          filter 180ms cubic-bezier(0.32, 0.72, 0, 1),
                          box-shadow 200ms cubic-bezier(0.32, 0.72, 0, 1); }
  .ap-organ:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .ap-organ:focus-visible { outline: 2px solid #65a9ff; outline-offset: 3px; }
  .ap-btn:focus-visible { outline: 2px solid #65a9ff; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
  /* Maez slime avatar — the embryo-self. Honest substrate-state face: blue body =
     identity (constant), amber ember = life, scatter hue = real valence (green +,
     rose -), breath = real cycle, stillness = real stall. */
  @keyframes mz-breathe { 0%,100%{ transform:scale(1) translateY(0) } 50%{ transform:scale(1.04) translateY(-2px) } }
  @keyframes mz-wobble { 0%,100%{ border-radius:54% 46% 52% 48% / 60% 58% 42% 40% } 33%{ border-radius:48% 52% 46% 54% / 56% 62% 38% 44% } 66%{ border-radius:52% 48% 54% 46% / 62% 56% 44% 38% } }
  @keyframes mz-ember { 0%,100%{ opacity:.82; transform:translate(-50%,-50%) scale(1) } 50%{ opacity:1; transform:translate(-50%,-50%) scale(1.08) } }
  @keyframes mz-rise { 0%,100%{ transform:translate(-50%,-50%) translateY(2px) scale(1); opacity:.74 } 50%{ transform:translate(-50%,-50%) translateY(-3px) scale(1.06); opacity:1 } }
  /* orbital rings: gently morph so they read as flowing threads, not rigid hoops */
  @keyframes mz-ring-flow { 0%,100%{ border-radius:46% 54% 55% 45% / 54% 46% 54% 46% } 25%{ border-radius:55% 45% 46% 54% / 45% 55% 47% 53% } 50%{ border-radius:45% 55% 53% 47% / 55% 45% 52% 48% } 75%{ border-radius:53% 47% 45% 55% / 47% 53% 55% 45% } }
  @keyframes mz-twinkle { 0%,100%{ opacity:.18; transform:scale(.8) } 50%{ opacity:.9; transform:scale(1.18) } }
  .mz-slime { position:relative; width:114px; height:100px; border-radius:54% 46% 52% 48% / 60% 58% 42% 40%; overflow:hidden;
    background:radial-gradient(58% 52% at 44% 32%, rgba(176,214,242,.92), rgba(96,156,214,.84) 52%, rgba(44,96,164,.82) 100%);
    box-shadow:inset 0 -12px 22px rgba(20,44,82,.5), 0 10px 28px rgba(70,140,210,.16);
    animation:mz-wobble 5s ease-in-out infinite, mz-breathe 4.4s ease-in-out infinite; }
  .mz-slime .mz-skin { position:absolute; inset:0; border-radius:inherit; z-index:6; pointer-events:none; box-shadow:inset 0 11px 18px rgba(255,255,255,.26); }
  .mz-slime .mz-skin::before { content:""; position:absolute; top:13px; left:26px; width:26px; height:14px; border-radius:50%; background:rgba(255,255,255,.5); filter:blur(2px); }
  .mz-slime .mz-em { position:absolute; top:74%; left:50%; transform:translate(-50%,-50%); width:40px; height:34px; z-index:3; filter:blur(5px); mix-blend-mode:screen;
    background:radial-gradient(ellipse, rgba(255,206,128,.95), rgba(243,176,86,.62) 32%, rgba(223,146,58,.24) 56%, transparent 78%); animation:mz-ember 4.4s ease-in-out infinite; }
  .mz-slime .mz-scatter { position:absolute; left:50%; top:78%; transform:translate(-50%,-50%); width:150px; height:150px; z-index:2; filter:blur(13px); mix-blend-mode:screen;
    background:radial-gradient(ellipse at 50% 62%, rgba(245,182,96,.34), rgba(232,160,72,.12) 42%, transparent 70%); animation:mz-rise 7s ease-in-out infinite; }
  .mz-slime .mz-ey { position:absolute; top:37px; left:0; right:0; display:flex; justify-content:center; gap:25px; z-index:7; }
  .mz-slime .mz-ey svg { overflow:visible; }
  .mz-slime.is-pos .mz-scatter { background:radial-gradient(ellipse at 50% 62%, rgba(108,224,160,.60), rgba(98,210,148,.26) 42%, transparent 73%); }
  .mz-slime.is-neg .mz-scatter { background:radial-gradient(ellipse at 50% 62%, rgba(232,120,146,.56), rgba(218,108,132,.24) 42%, transparent 73%); animation-duration:8.5s; }
  .mz-slime.is-stall { animation:none; filter:saturate(.32); }
  .mz-slime.is-stall .mz-em { animation:none; opacity:.42; background:radial-gradient(ellipse, rgba(150,156,150,.5), transparent 70%); }
  .mz-slime.is-stall .mz-scatter { animation:none; opacity:.25; background:radial-gradient(ellipse at 50% 62%, rgba(150,156,150,.3), transparent 70%); }
</style>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="text/babel" src="/cockpit/v2/sim.jsx"></script>
<script type="text/babel" src="/cockpit/v2/terminal-ui.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { ChatPane, ServicesPane, GpuPane, DaemonPane, SignalsPane, ScratchpadPane, RouterPane,
        ReadinessPane, StatusTile,
        MemorySurface, SoulSurface, DreamsSurface, IdentitySurface, LogsSurface, ApprovalsQueueSurface,
        JudgmentSurface, SelfDevSurface, WorkshopSurface,
        DaemonDeep, S, A, Card, Glass, Chip, Pill, Dot, Button, SoftBtn, MaezAvatar, Icon } = window.TerminalUI;

function MaezNowRail() {
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState('');

  React.useEffect(() => {
    let alive = true;
    const load = async () => {
      try {
        const res = await fetch('/api/v1/now');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        if (alive) { setData(json); setError(''); }
      } catch (e) {
        if (alive) setError(String(e));
      }
    };
    load();
    const id = setInterval(load, 5000);
    return () => { alive = false; clearInterval(id); };
  }, []);

  const now = data?.now || {};
  const body = data?.body || {};
  const broken = data?.broken?.items || [];
  const memory = data?.memory || {};
  const pending = data?.pending_actions || {};

  return (
    <div style={{ padding: '14px 18px', margin: '4px 12px 0', borderTop: `0.5px solid ${A.stroke}`, fontFamily: A.sans }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 8 }}>
        <Dot c={error ? A.red : A.green} pulse={!error} size={6} />
        <span style={{ fontSize: 11, color: A.text, fontWeight: 700 }}>Maez Now</span>
      </div>
      {error ? (
        <div style={{ fontSize: 11, color: A.red, lineHeight: 1.45 }}>Now view unavailable: {error}</div>
      ) : (
        <>
          <div style={{ fontSize: 11, color: A.textDim, lineHeight: 1.45, marginBottom: 10 }}>
            {now.summary || 'Waiting for Maez current state.'}
          </div>
          {now.thought && (
            <div style={{ fontFamily: A.sans, fontStyle: 'italic', fontSize: 12, color: A.textSoft, lineHeight: 1.45, marginBottom: 10 }}>
              "{now.thought}"
            </div>
          )}
          <div style={{ display: 'grid', gap: 6, fontFamily: A.mono, fontSize: 10.5, color: A.textDim, lineHeight: 1.45 }}>
            <div>cycle <span style={{ color: A.cyan }}>{now.cycle || 0}</span></div>
            <div>brain <span style={{ color: A.textSoft }}>{body.brain_model || 'unknown'}</span></div>
            <div>memory <span style={{ color: A.textSoft }}>{memory.summary || 'counts unavailable'}</span></div>
            <div>pending <span style={{ color: pending.count ? A.orange : A.green }}>{pending.count || 0}</span></div>
          </div>
          {broken.length > 0 && (
            <div style={{ marginTop: 11, display: 'grid', gap: 5 }}>
              {broken.slice(0, 4).map((b, i) => (
                <div key={i} style={{ border: `0.5px solid ${A.red}33`, background: `${A.red}0f`, borderRadius: 7, padding: '6px 7px' }}>
                  <div style={{ fontSize: 10.5, color: A.text, fontWeight: 700 }}>{b.label}</div>
                  <div style={{ fontSize: 10.5, color: A.textDim, lineHeight: 1.35, marginTop: 2 }}>{b.summary}</div>
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function WhyReplyPane({ selectedTurn }) {
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState('');

  React.useEffect(() => {
    let alive = true;
    const load = async () => {
      try {
        const res = await fetch('/api/v1/turn/latest');
        const json = await res.json().catch(() => null);
        if (!res.ok) {
          // A 404 carrying a summary is the backend's honest "nothing to
          // explain yet" state (no recent chat turn), NOT a failure. Render
          // it calmly — never paint a red alarm over a true empty state.
          if (res.status === 404 && json && json.summary_one_line) {
            if (alive) { setData(json); setError(''); }
            return;
          }
          throw new Error('HTTP ' + res.status);
        }
        if (alive) { setData(json); setError(''); }
      } catch (e) {
        if (alive) setError(String(e));
      }
    };
    load();
    const id = setInterval(load, 30000);
    return () => { alive = false; clearInterval(id); };
  }, []);

  const selectedText = selectedTurn?.message?.content || '';
  const notLatest = selectedTurn && selectedTurn.isLatest === false;
  const flagged = data?.audit?.flagged_claims || [];
  const toolRuns = data?.tools?.items || [];

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', minHeight: 0 }}>
      <div style={{ padding: '4px 4px 12px', borderBottom: `0.5px solid ${A.stroke}` }}>
        <div style={{ fontSize: 10, color: A.textFaint, letterSpacing: 1.1, textTransform: 'uppercase', fontWeight: 800 }}>Why this reply</div>
        <div style={{ fontSize: 13, color: A.textSoft, lineHeight: 1.45, marginTop: 7 }}>
          {selectedTurn ? 'Selected Maez reply. Latest-turn evidence is shown below.' : 'Select a Maez reply in the chat to inspect it.'}
        </div>
      </div>
      <div className="ap-scroll" style={{ flex: 1, overflow: 'auto', padding: '12px 2px 2px', display: 'grid', gap: 12, alignContent: 'start' }}>
        {selectedText && (
          <WhyBlock title="selected reply">
            <div style={{ color: A.textSoft, fontSize: 12.5, lineHeight: 1.5, whiteSpace: 'pre-wrap' }}>{selectedText.slice(0, 520)}</div>
            {notLatest && <div style={{ color: A.orange, fontSize: 11.5, lineHeight: 1.45, marginTop: 8 }}>Full explanation is only available for the most recent turn until the per-turn ledger lands.</div>}
          </WhyBlock>
        )}
        {error && <WhyBlock title="evidence unavailable"><span style={{ color: A.red }}>Could not load latest-turn explanation: {error}</span></WhyBlock>}
        {data?.summary_one_line && <WhyBlock title="in one sentence">{data.summary_one_line}</WhyBlock>}
        <WhyBlock title="what Maez remembered">{data?.maez_remembered?.summary || 'Waiting for latest-turn memory evidence.'}</WhyBlock>
        <WhyBlock title="body signals">
          <div>{data?.maez_knew?.summary || 'Signal receipts are not available for this latest turn.'}</div>
        </WhyBlock>
        <WhyBlock title="honesty audit">
          <div>{data?.audit?.summary || 'Waiting for latest-turn audit evidence.'}</div>
          {flagged.length > 0 && (
            <div style={{ display: 'grid', gap: 7, marginTop: 9 }}>
              {flagged.slice(0, 4).map((f, i) => (
                <div key={i} style={{ borderLeft: `2px solid ${A.orange}`, paddingLeft: 8 }}>
                  <div style={{ color: A.text, fontSize: 12 }}>{f.claim}</div>
                  <div style={{ color: A.textDim, fontSize: 11, marginTop: 2 }}>{f.reason}</div>
                </div>
              ))}
            </div>
          )}
        </WhyBlock>
        <WhyBlock title="tools">{data?.tools?.summary || 'No tool evidence loaded.'}</WhyBlock>
        {toolRuns.length > 0 && toolRuns.slice(0, 3).map((t, i) => (
          <WhyBlock key={i} title={t.success ? 'tool succeeded' : 'tool failed'}>{t.cmd || t.request_id}</WhyBlock>
        ))}
        <WhyBlock title="memory written">{data?.memory_written?.summary || 'No storage evidence loaded.'}</WhyBlock>
      </div>
    </div>
  );
}

function WhyBlock({ title, children }) {
  return (
    <div style={{ background: A.surfaceLo, border: `0.5px solid ${A.stroke}`, borderRadius: 12, padding: 12 }}>
      <div style={{ fontSize: 9.5, color: A.textFaint, letterSpacing: 1, textTransform: 'uppercase', fontWeight: 800, marginBottom: 7 }}>{title}</div>
      <div style={{ color: A.textSoft, fontSize: 12.5, lineHeight: 1.5 }}>{children}</div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// Direction A — Terminal Command-Center
// 1440×900 tiled workstation. Sidebar switches the "focus" surface
// that takes over the main area while dashboard tiles stay live.
// ═══════════════════════════════════════════════════════════
function TerminalDirection() {
  const sim = useSim();
  // Workstation v1 / Session 1: cockpit opens to chat by default.
  // The cockpit is a room to talk to Maez, not a dashboard. A user
  // who explicitly navigates to another surface (Dashboard, Memory,
  // Soul, etc.) has their choice persisted in localStorage so the
  // page restores their last-active surface on reload — but a brand
  // new visitor lands in conversation.
  const [surface, setSurface] = React.useState(() => {
    try {
      return localStorage.getItem('maez.cockpit.surface') || 'chat';
    } catch (e) {
      return 'chat';
    }
  });
  const [dashboardMode, setDashboardMode] = React.useState(() => {
    try {
      return localStorage.getItem('maez.cockpit.dashboardMode') || 'living';
    } catch (e) {
      return 'living';
    }
  });
  const [selectedTurn, setSelectedTurn] = React.useState(null);
  const setSurfaceStored = React.useCallback((next) => {
    setSurface(next);
    try {
      localStorage.setItem('maez.cockpit.surface', next);
    } catch (e) {}
  }, []);
  const setDashboardModeStored = React.useCallback((mode) => {
    setDashboardMode(mode);
    try {
      localStorage.setItem('maez.cockpit.dashboardMode', mode);
    } catch (e) {}
  }, []);
  const openSurface = React.useCallback((nextSurface, mode) => {
    if (mode) setDashboardModeStored(mode);
    setSurfaceStored(nextSurface);
  }, [setDashboardModeStored, setSurfaceStored]);

  const nav = [
    { id: 'dashboard',  label: 'Dashboard',   hotkey: '1', icon: '◈' },
    { id: 'chat',       label: 'Conversation',hotkey: '2', icon: '◉', badge: sim.state.chat.pendingCommand ? '!' : null },
    { id: 'approvals',  label: 'Approvals',   hotkey: '3', icon: '◐', badge: (sim.state.approvals.length + (sim.state.chat.pendingCommand?1:0)) || null },
    { id: 'memory',     label: 'Memory',      hotkey: '4', icon: '◍' },
    { id: 'soul',       label: 'Soul',        hotkey: '5', icon: '❋' },
    { id: 'signals',    label: 'Ambient',     hotkey: '6', icon: '≈' },
    { id: 'router',     label: 'Routing',     hotkey: '7', icon: '⇌' },
    { id: 'daemon',     label: 'Daemon',      hotkey: '8', icon: '◎' },
    { id: 'dreams',     label: 'Dreams',      hotkey: '9', icon: '✧', badge: sim.state.dreams.filter(d => d.status === 'pending').length || null },
    { id: 'identity',   label: 'Identity',    hotkey: '0', icon: '⬡' },
    { id: 'judgment',   label: 'Judgment',    hotkey: 'J', icon: '⚖' },
    { id: 'selfdev',    label: 'Self-Dev',    hotkey: 'S', icon: '◈' },
    { id: 'workshop',   label: 'Workshop',    hotkey: 'W', icon: '◇' },
    { id: 'logs',       label: 'Logs',        hotkey: 'L', icon: '▤' },
  ];

  return (
    <div style={{ width: '100vw', height: '100vh', background: A.bg, color: A.text, fontFamily: A.sans,
      display: 'grid', gridTemplateColumns: '236px minmax(0, 1fr) 380px', gridTemplateRows: '52px 1fr', overflow: 'hidden',
      backgroundImage: `radial-gradient(ellipse 70% 50% at 18% 4%, ${A.orange}1f 0%, transparent 56%), radial-gradient(ellipse 60% 45% at 78% 12%, ${A.cyan}18 0%, transparent 58%), radial-gradient(ellipse 55% 45% at 62% 92%, ${A.purple}18 0%, transparent 62%), linear-gradient(180deg, rgba(255,255,255,0.025), transparent 28%)` }}
      data-screen-label="maez · command center">

      {/* top bar */}
      <div className="ap-glass" style={{ gridColumn: '1 / -1', background: 'rgba(9,10,7,0.68)', borderBottom: `0.5px solid ${A.stroke}`, display: 'flex', alignItems: 'center', padding: '0 22px', gap: 14, fontSize: 11, color: A.textDim }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <MaezAvatar size={24} />
          <div>
            <div style={{ fontFamily: A.sans, fontSize: 14, color: A.text, fontWeight: 700, letterSpacing: -0.2 }}>Maez Cockpit</div>
            <div style={{ fontFamily: A.mono, fontSize: 9.5, color: A.textFaint, marginTop: 1 }}>observation surface · Track A</div>
          </div>
        </div>
        <span style={{ width: 1, height: 14, background: A.stroke }} />
        <Chip color={A.green}><Dot c={A.green} size={4} pulse /> live-first</Chip>
        <Chip color={A.orange}>observation only</Chip>
        <span style={{ flex: 1 }} />
        <span style={{ width: 1, height: 14, background: A.stroke }} />
        <span style={{ fontFamily: A.mono, fontSize: 10, color: A.textFaint }}>official continuity · 15/15</span>
        <span style={{ fontFamily: A.mono, fontSize: 10, color: A.textDim }}>{sim.state.daemon.lastTick}</span>
      </div>

      {/* sidebar */}
      <div className="ap-glass" style={{ background: 'rgba(9,10,7,0.58)', borderRight: `0.5px solid ${A.stroke}`, padding: '16px 0', display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '0 22px 12px', fontSize: 10, color: A.textFaint, letterSpacing: 0.8, textTransform: 'uppercase', fontFamily: A.sans, fontWeight: 600 }}>Surfaces</div>
        <div style={{ padding: '0 10px' }}>
          {nav.map((n) => {
            const active = surface === n.id;
            return (
              <button key={n.id} className="ap-btn" onClick={() => setSurfaceStored(n.id)}
                style={{ width: '100%', background: active ? A.surfaceRaised : 'transparent', border: active ? `0.5px solid ${A.strokeHi}` : '0.5px solid transparent',
                  color: active ? A.text : A.textDim, padding: '8px 12px', fontFamily: A.sans, fontSize: 13, fontWeight: active ? 500 : 400,
                  textAlign: 'left', display: 'flex', alignItems: 'center', gap: 10, borderRadius: 8, marginBottom: 2,
                  position: 'relative', boxShadow: active ? 'inset 0 0.5px 0 rgba(255,255,255,0.08)' : 'none' }}
                onMouseEnter={(e) => { if (!active) { e.currentTarget.style.background = A.surfaceLo; e.currentTarget.style.color = A.textSoft; } }}
                onMouseLeave={(e) => { if (!active) { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = A.textDim; } }}>
                <span style={{ color: active ? A.blue : A.textFaint, width: 14, fontSize: 12, textAlign: 'center' }}>{n.icon}</span>
                <span style={{ flex: 1 }}>{n.label}</span>
                {n.badge && <span style={{ background: A.orange, color: '#fff', fontSize: 9, padding: '1px 6px', borderRadius: 999, fontFamily: A.sans, fontWeight: 600, minWidth: 14, textAlign: 'center' }}>{n.badge}</span>}
                <span style={{ color: A.textFaint, fontFamily: A.mono, fontSize: 9, opacity: active ? 0.9 : 0.5 }}>{n.hotkey}</span>
              </button>
            );
          })}
        </div>
        <div style={{ flex: 1 }} />
        <MaezNowRail />
      </div>

      {/* main — surface */}
      <div style={{ overflow: 'hidden', display: 'flex', flexDirection: 'column', position: 'relative' }}>
        {surface === 'dashboard' && (
          <DashboardGrid
            mode={dashboardMode}
            onMode={setDashboardModeStored}
            openSurface={openSurface}
          />
        )}
        {surface === 'chat' && <div style={{ padding: 20, height: '100%', display: 'flex' }}><div style={{ flex: 1, display: 'flex' }}><ChatPane tall selectedTurn={selectedTurn} onSelectTurn={setSelectedTurn} /></div></div>}
        {surface === 'approvals' && <ApprovalsQueueSurface />}
        {surface === 'memory' && <MemorySurface />}
        {surface === 'soul' && <SoulSurface />}
        {surface === 'signals' && <div style={{ padding: 20, height: '100%' }}><SignalsPane /></div>}
        {surface === 'router' && <div style={{ padding: 20, height: '100%' }}><RouterPane /></div>}
        {surface === 'daemon' && <DaemonDeep />}
        {surface === 'dreams' && <DreamsSurface />}
        {surface === 'identity' && <IdentitySurface />}
        {surface === 'judgment' && <JudgmentSurface />}
        {surface === 'selfdev' && <SelfDevSurface />}
        {surface === 'workshop' && <WorkshopSurface />}
        {surface === 'logs' && <LogsSurface />}
      </div>

      {/* right rail */}

// Maez's face — the slime, rendered from the global mz-slime CSS. Honest substrate
// state: blue body = identity, amber ember = life, scatter hue = real valence
// (green +, rose -, amber neutral), breath = real cycle, stillness = real stall.
// Decorative star field for the galaxy hero — ambiance only (NOT data). Deterministic
// positions so it doesn't re-randomize on every render.
const STARS = Array.from({ length: 60 }, (_, i) => {
  const a = Math.sin(i * 12.9898) * 43758.5453;
  const b = Math.sin(i * 78.233 + 1.7) * 12543.331;
  return {
    top: Math.abs(a - Math.floor(a)) * 100,
    left: Math.abs(b - Math.floor(b)) * 100,
    s: 0.6 + Math.abs(Math.sin(i * 3.7)) * 1.7,
    d: (i % 9) * 0.5,
    o: 0.18 + Math.abs(Math.sin(i * 2.1)) * 0.5,
  };
});
function Starfield() {
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none', zIndex: 0 }} aria-hidden="true">
      {STARS.map((st, i) => (
        <span key={i} style={{
          position: 'absolute', top: `${st.top}%`, left: `${st.left}%`,
          width: st.s, height: st.s, borderRadius: '50%',
          background: i % 5 === 0 ? '#a9c4ff' : '#e2e8ff', opacity: st.o,
          boxShadow: `0 0 ${st.s * 2.6}px #9fb4ff`,
          animation: `mz-twinkle ${3.5 + st.d}s ease-in-out ${st.d}s infinite`,
        }} />
      ))}
    </div>
  );
}

function MaezSlimeBlob({ d, scale = 1 }) {
  let variant = '';
  if (!d || d.stalled || d.status === 'stalled' || d.status === 'stopped') variant = 'is-stall';
  else if (d.valence && d.valence.magnitude && d.valence.magnitude !== 'none') {
    if (d.valence.sign === 'positive') variant = 'is-pos';
    else if (d.valence.sign === 'negative') variant = 'is-neg';
  }
  const eye = <svg width="20" height="12"><path d="M1,5 Q10,10 19,5" stroke="#0e2236" strokeWidth="2" fill="none" strokeLinecap="round" /></svg>;
  return (
    <div style={{ transform: `scale(${scale})`, transformOrigin: 'center' }}>
      <div className={`mz-slime ${variant}`} role="img"
        aria-label={`Maez, the embryo. ${(!d || d.stalled) ? 'Not cycling.' : 'Alive and cycling.'} Felt-state ${(d && d.valence && d.valence.sign) || 'neutral'}.`}>
        <div className="mz-scatter"></div>
        <div className="mz-em"></div>

  );
}

// 2026-04-26 owner asked for "memory shelves" — a visual cue for
// Core/Daily/Raw proportions instead of a single comma-list. This is
// the only OrganCard with custom inner content; the variant keeps
// the same outer shape so the row of cards stays uniform.
function MemoryOrganCard({ mem, onClick }) {
  const core = Number(mem?.core || 0);
  const daily = Number(mem?.daily || 0);
  const raw = Number(mem?.raw || 0);
  const total = Math.max(core + daily + raw, 1);
  // Log-scale the bar widths so the raw tier (which dominates by
  // 1000:1 in normal operation) doesn't squash core/daily into
  // invisibility. Floor each tier at 4% so non-zero counts always
  // show.
  const log = (n) => (n > 0 ? Math.log10(n + 1) : 0);
  const tot = log(core) + log(daily) + log(raw) || 1;
  const w = (n) => Math.max(4, (log(n) / tot) * 100);

  // into `data-tooltip` — browsers show `title` natively, screen
  // readers read `aria-label`. The owner's copy convention (visible
  // wording) lives in the body text below.
  const tooltipExtended = `Memory — ${core} core · ${daily} daily · ${raw.toLocaleString()} raw. The three shelves are tiers, not a deletion queue.`;

        <div style={{
          width: 42, height: 42, borderRadius: 15,
          display: 'grid', placeItems: 'center',
          background: `${A.blue}2b`,
          border: `0.5px solid ${A.blue}55`,
          color: A.blue,

        <div style={{ minWidth: 0 }}>

function InnerMemory() {

    { id: 'core', label: 'Core', note: 'facts about you. a small, dense set. I rewrite it when something changes.', color: I.amber },
    { id: 'daily', label: 'Daily', note: 'summaries of each day. I write these when you sleep.', color: I.sage },

  ];
  return (
    <div>
      <div style={{ fontFamily: I.serif, fontSize: 28, color: I.ink, letterSpacing: -0.5, marginBottom: 6 }}>Memory</div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 16, marginBottom: 24 }}>

        <div key={i} style={{ borderLeft: `2px solid ${{core:I.amber,daily:I.sage,raw:I.indigo}[h.tier]}`, paddingLeft: 16, marginBottom: 14 }}>
          <div style={{ fontFamily: I.sans, fontSize: 10, color: I.inkDim, letterSpacing: 0.8, textTransform: 'uppercase', marginBottom: 2 }}>{h.tier} · {h.date} · score {h.score.toFixed(2)}</div>

}

function InnerDreams() {
  const sim = useSim();
  return (
    <div>

      </div>
      {sim.state.dreams.map((d) => (
        <div key={d.id} style={{ background: I.paperHi, border: `1px solid ${I.rule}`, padding: 20, marginBottom: 14, borderLeft: `3px solid ${{pending:I.amber,approved:I.sage,rejected:I.claret}[d.status]}` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
