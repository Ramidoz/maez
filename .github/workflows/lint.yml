name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: Lint the runtime tree (strict — PR gate)
        # ruff config lives in pyproject.toml under [tool.ruff.lint].
        # The selected rule set catches real bugs (pyflakes, syntax,
        # mutable-arg defaults, closure-over-loop pitfalls, strict-zip).
        # Modernisation + format rules (UP, I, E7, full B) are deferred
        # to a later sweep; see pyproject.toml comment for the plan.
        run: ruff check core/ skills/ daemon/ tests/ cli/ scripts/

      - name: Format check (informational only)
        # Format check stays informational until the modernisation
        # sweep lands — a one-shot reformat would bury real diffs for
        # no immediate reader benefit.
        continue-on-error: true
        run: ruff format --check core/ skills/ daemon/ tests/ cli/ scripts/
