<svg width="400" height="400" viewBox="0 0 400 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Maez logo</title>
  <desc>Square dark logo for Maez — organic starburst of rounded petals radiating from a glowing core</desc>

  <rect width="400" height="400" rx="24" fill="#08090f"/>

  <!-- Corner ticks -->
  <line x1="36" y1="52" x2="36" y2="36" stroke="#1c2a3a" stroke-width="1.4"/>
  <line x1="36" y1="36" x2="52" y2="36" stroke="#1c2a3a" stroke-width="1.4"/>
  <line x1="364" y1="52" x2="364" y2="36" stroke="#1c2a3a" stroke-width="1.4"/>
  <line x1="364" y1="36" x2="348" y2="36" stroke="#1c2a3a" stroke-width="1.4"/>
  <line x1="36" y1="348" x2="36" y2="364" stroke="#1c2a3a" stroke-width="1.4"/>
  <line x1="36" y1="364" x2="52" y2="364" stroke="#1c2a3a" stroke-width="1.4"/>
  <line x1="364" y1="348" x2="364" y2="364" stroke="#1c2a3a" stroke-width="1.4"/>
  <line x1="364" y1="364" x2="348" y2="364" stroke="#1c2a3a" stroke-width="1.4"/>

  <!-- 8 rounded petals -->
  <g transform="translate(200,200)">
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="#1e4a7a" transform="rotate(0)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="#1a3f6a" transform="rotate(45)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="#1e4a7a" transform="rotate(90)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="#1a3f6a" transform="rotate(135)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="#1e4a7a" transform="rotate(180)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="#1a3f6a" transform="rotate(225)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="#1e4a7a" transform="rotate(270)"/>
    <rect x="-11" y="-94" width="22" height="68" rx="11" fill="#1a3f6a" transform="rotate(315)"/>
  </g>

  <!-- Rings -->
  <circle cx="200" cy="200" r="64" fill="none" stroke="#163250" stroke-width="0.8"/>
  <circle cx="200" cy="200" r="44" fill="none" stroke="#1e4870" stroke-width="0.8"/>

  <!-- Iris -->
  <circle cx="200" cy="200" r="32" fill="#0e1e30"/>
  <circle cx="200" cy="200" r="32" fill="none" stroke="#2e72b8" stroke-width="1.4"/>

  <!-- Pupil -->
  <circle cx="200" cy="200" r="18" fill="none" stroke="#3a8fd4" stroke-width="1"/>
  <circle cx="200" cy="200" r="11" fill="#1a4a7a"/>

  <!-- Core -->
  <circle cx="200" cy="200" r="5.5" fill="#5ab4f0"/>
  <circle cx="200" cy="200" r="2" fill="#a8deff"/>

  <!-- Wordmark -->
  <text x="200" y="348"
    text-anchor="middle"
    font-family="monospace"
    font-size="14"
    font-weight="500"
    letter-spacing="7"
    fill="#2a5e96">MAEZ</text>
</svg>
