# Maez — project manifest.
#
# Ships the Python runtime dependencies the daemon + web surface +
# subscription proxy need. Training deps are intentionally separate
# (see training/requirements.txt); heavy vision deps are an extra.
#
# Usage:
#   python3.12 -m venv .venv
#   . .venv/bin/activate
#   pip install -e .                 # core runtime
#   pip install -e .[vision]         # + face_recognition / dlib
#   pip install -e .[google]         # + calendar / drive APIs
#   pip install -e .[dev]            # + linter + test tools
#   pip install -e .[all]            # everything
#
# Entry points (Phase 4 — will expand in follow-ups):
#   maez daemon          — run the daemon (legacy: python -m daemon.maez_daemon)
#   maez web             — run the web surface
#   maez proxy           — run the subscription proxy
#   maez self-dev ...    — self-dev CLI (passthrough to core.self_dev)

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[project]
name = "maez"
version = "0.1.0a0"
description = "Always-on local AI companion with persistent memory, evolving soul, and sovereign reasoning."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Rohit Ananthan"},
]
keywords = ["ai", "agent", "local-llm", "daemon", "jarvis", "companion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Minimum runtime deps for the daemon + web + proxy to boot. Version
# floors reflect what's currently installed and verified green;
# loose ceilings because this is alpha and pins-as-you-go has not
# yet become a release-engineering concern.
dependencies = [
    # HTTP + web
    "flask>=3.0",
    "fastapi>=0.100",
    "uvicorn>=0.25",
    "requests>=2.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Config + serialization
    "pyyaml>=6.0",
    # Vector memory + numerics
    "chromadb>=1.0",
    "numpy>=1.26",
    "scipy>=1.10",
    # Host introspection
    "psutil>=5.9",
    # LLM clients (both local and subscription-proxied)
    "ollama>=0.5",
    "anthropic>=0.70",
    "openai>=2.0",
    # Observability
    "langfuse>=2.60",
    # CLI framework (used by core.self_dev CLI + future `maez` entry point)
    "click>=8.1",
]

[project.optional-dependencies]
# Face recognition + vision perception. Heavy native deps (dlib,
# opencv). Not required for core daemon; skip on headless servers.
vision = [
    "opencv-python>=4.10",
    "face_recognition>=1.3",
]

# Telegram surface. If unset, the daemon simply runs without the
# Telegram push channel.
telegram = [
    "python-telegram-bot>=22",
]

# Google API surfaces (Calendar, Drive). Off by default.
google = [
    "google-api-python-client>=2.100",
    "requests-oauthlib>=2.0",
]

# Development and CI.
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "build>=1.0",
]

# Everything — convenience for contributors who want the full surface.
all = [
    "maez[vision,telegram,google,dev]",
]

[project.urls]
Homepage = "https://github.com/Ramidoz/maez"
Documentation = "https://github.com/Ramidoz/maez/tree/main/docs"
Issues = "https://github.com/Ramidoz/maez/issues"

[project.scripts]
# Console-script entry points are drafted for Phase 4. The actual
# CLI dispatcher (cli/maez.py) is wired up in a follow-up commit;
# until then these refer to the existing module-level CLIs.
"maez-self-dev" = "core.self_dev.__main__:__main__"
"maez-proxy" = "core.subscription_proxy.__main__:__main__"

# ── Hatchling packaging configuration ──────────────────────────────────
[tool.hatch.build.targets.wheel]
# Ship just the importable Python packages — leave models, memory
# databases, logs, training artifacts, docs out of the wheel.
packages = ["core", "memory", "daemon", "skills"]

[tool.hatch.build.targets.sdist]
include = [
    "/core",
    "/memory",
    "/daemon",
    "/skills",
    "/cli",
    "/scripts",
    "/config/identity.template.yaml",
    "/config/soul.base.md",
    "/config/soul.local.template.md",
    "/.env.example",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]


# ── Ruff (lint + format) ───────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "training/.venv",
    # Unsloth emits compiled trainer wrappers into a per-repo cache
    # directory that is gitignored but present on disk. It's not our
    # code — excluding prevents ~1000 false-positive lint hits in
    # generated tensor-program scaffolds. Added 2026-04-23 Commit 7
    # alongside widening the CI lint surface to include training/.
    "training/unsloth_compiled_cache",
    # SFT run artifacts (merge_and_convert.py is an auto-generated
    # helper per run). Gitignored but left on disk across runs;
    # excluding from lint matches the gitignore's intent. Added
    # 2026-04-23 Commit 7b.
    "training/runs",
    "models",
    "memory/db",
    "logs",
    "backups",
    "web/node_modules",
    "web/.next",
    # ui/ holds owner-WIP scaffolds (e.g. maez_pulse_bridge.py)
    # that aren't part of the daemon/web/proxy surfaces. Excluded
    # from lint so untracked exploratory files don't show as repo
    # drift; promoted out of ui/ when ready.
    "ui",
]

[tool.ruff.lint]
# The rule set is strict-gate as of 2026-04-23 — these are the
# checks that catch real bugs (undefined names, unused imports,
# mutable-arg defaults, etc.). Modernization/style rules (UP, I,
# full B, full E) are Phase-8-follow-up work tracked in
# docs/ROADMAP.md — a format sweep is the prerequisite, not a
# one-line config change.
select = [
    "F",      # pyflakes — undefined names, unused imports, f-strings
    "E9",     # syntax errors
    "B006",   # mutable-argument-default (real bug)
    "B023",   # function-uses-loop-variable (closure-over-loop pitfall)
    "B905",   # zip-without-explicit-strict (3.12+)
]

ignore = [
    # Nothing currently ignored from the selected rule set. Drops here
    # should come with a named reason and a memory / issue reference.
]

# Deferred (land after the Phase-8-follow-up format sweep):
#   E7 (statement-level pycodestyle), E501 (line length), UP (pyupgrade),
#   I (isort), B904 (raise-without-from), B007 (unused-loop-control),
#   B011 (assert-False — already fixed the single remaining instance).
# See docs/ROADMAP.md Phase 8 for the sweep plan.
